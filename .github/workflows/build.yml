name: Build-Kernel-with-GCC
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: "LA.UM.9.6.4.r1-04300-89xx.QSSI13.0"

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04
    steps:

      - name: Get branch names.
        id: branch-names
        uses: tj-actions/branch-names@v8

      - name: Set SWAP to 5GiB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - name: Initialize compilation environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git automake flex lzop bison gperf build-essential zip curl zlib1g-dev \
            g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven \
            libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl \
            libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev \
            libgl1-mesa-dev xsltproc unzip device-tree-compiler python2 python3 \
            libelf-dev

          # 强制将 python 链接到 python2（修复 gcc-wrapper.py 的 Python 2 语法）
          sudo ln -sf /usr/bin/python2 /usr/bin/python

          mkdir -p $GITHUB_WORKSPACE/workdir
          cd $GITHUB_WORKSPACE/workdir
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y%m%d%H%M')" >> $GITHUB_ENV

      - name: Download and extract GCC toolchain (Linaro aarch64)
        run: |
          cd $GITHUB_WORKSPACE/workdir
          # 使用 Linaro GCC 7.5（稳定且兼容老内核）
          wget -q --show-progress \
            https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/aarch64-linux-gnu/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
          tar -xf gcc-linaro-*.tar.xz
          echo "GCC_PATH=$GITHUB_WORKSPACE/workdir/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu" >> $GITHUB_ENV

      - name: Get Kernel source
        run: |
          git clone --recursive https://github.com/$GITHUB_REPOSITORY/ \
                    -b ${{ steps.branch-names.outputs.current_branch }} --depth 1 \
                    $GITHUB_WORKSPACE/workdir/source

      - name: Build Kernel with GCC
        run: |
          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
          export ARCH="arm64"
          export SUBARCH="arm64"

          # GCC 工具链路径
          export CROSS_COMPILE="${{ env.GCC_PATH }}/bin/aarch64-linux-gnu-"
          export PATH="${{ env.GCC_PATH }}/bin:$PATH"

          # 验证工具链
          ${CROSS_COMPILE}gcc --version

          cd $GITHUB_WORKSPACE/workdir/source

          # 清理之前的编译产物（如果有）
          rm -rf out

          # 配置并编译（不需要 LLVM=1，也不需要设置 CC/LD 等）
          make O=out vendor/msm8937-perf_defconfig
          make -j$(nproc --all) O=out

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: workdir/source/out/arch/arm64/boot/Image.gz-dtb
